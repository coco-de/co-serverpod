name: serverpod_offline_sync_server
version: 0.0.8+co.1
description: >-
  co-serverpod fork of the Serverpod Offline Sync server module, built for
  Serverpod 4.1.
homepage: https://github.com/marcelomendoncasoares/serverpod_offline_sync
repository: https://github.com/coco-de/co-serverpod
publish_to: none

environment:
  sdk: '^3.12.2'

dependencies:
  meta: ^1.16.0
  serverpod: ^4.1.0-beta.1
  serverpod_database: ^4.1.0-beta.1
  serverpod_offline_sync:
    path: ../serverpod_offline_sync

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_cli: ^4.1.0-beta.1
  serverpod_test: ^4.1.0-beta.1
  test: ^1.25.5
