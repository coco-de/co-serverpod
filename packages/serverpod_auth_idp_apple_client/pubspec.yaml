name: serverpod_auth_idp_apple_client
description: >-
  Client library for the serverpod_auth_idp_apple Serverpod module. Generated
  protocol + endpoint callers for Apple login (Sign in with Apple, with nonce).
version: 2.0.1
repository: https://github.com/coco-de/co-serverpod

environment:
  sdk: ">=3.8.0 <4.0.0"

resolution: workspace

dependencies:
  serverpod_client: ^4.0.0-beta.2
  serverpod_auth_core_client: ^4.0.0-beta.2
  # The generated protocol references the parent idp module's client.
  serverpod_auth_idp_client: ^4.0.0-beta.2

dev_dependencies:
  lints: ^5.0.0
