  serverpod_auth_core_server: ^4.0.0-beta.2
  sign_in_with_apple_server: ^1.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  serverpod_test: ^4.0.0-beta.2
