### Session handshake sent once by each peer before any space work.
###
### [localNodeId] is this peer's persistent CRDT replica identity, shared
### across all spaces. It is announced once on connect rather than per space.
### [syncTablesHash] is the deterministic schema hash both sides must agree on
### before merging data.
class: OfflineSyncConnect
extends: OfflineSyncStreamEvent
fields:
  ### This peer's node identifier.
  localNodeId: UuidValue

  ### The hash of the synchronized schema configured on this peer.
  syncTablesHash: String

  ### The wait between continuous sync rounds this peer asks for in this
  ### session (fork, unibook#14207).
  ###
  ### Each peer bounds the slower of the two requests by its own settings:
  ### never below its configured interval, never above its maximum. Null when
  ### the peer asks for nothing, in a `once` session, and from a peer built
  ### before the field existed, whose generated `fromJson` also ignores it.
  continuousSyncInterval: Duration?
