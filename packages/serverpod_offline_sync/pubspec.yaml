name: serverpod_offline_sync
version: 0.0.8+co.1
description: >-
  co-serverpod fork of the shared Serverpod Offline Sync package, built for
  Serverpod 4.1 with CRDT-aware reactive `Model.db.watch` support.
homepage: https://github.com/marcelomendoncasoares/serverpod_offline_sync
repository: https://github.com/coco-de/co-serverpod
publish_to: none

environment:
  sdk: '^3.12.2'

dependencies:
  clock: ^1.1.2
  meta: ^1.18.0
  serverpod_database: ^4.1.0-beta.1
  serverpod_serialization: ^4.1.0-beta.1
  uuid: ^4.5.3

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.25.5
