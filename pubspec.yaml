name: serverpod_auth_kr_workspace

environment:
  sdk: ">=3.8.0 <4.0.0"

workspace:
  - packages/serverpod_auth_idp_apple_client
  - packages/serverpod_auth_idp_apple_server
  - packages/serverpod_auth_idp_kakao_client
  - packages/serverpod_auth_idp_kakao_flutter
  - packages/serverpod_auth_idp_kakao_server
  - packages/serverpod_auth_idp_naver_client
  - packages/serverpod_auth_idp_naver_flutter
  - packages/serverpod_auth_idp_naver_server

dev_dependencies:
  melos: ^8.6.0

melos:
  scripts:
    offline-sync:analyze:
      run: cd packages/co_offline_sync && dart analyze --fatal-infos && cd ../co_sync && flutter analyze --fatal-infos
      description: 독립 동기화 패키지 분석 (각 패키지 pub get 선행)

    offline-sync:test:
      run: cd packages/co_offline_sync && dart test && cd ../co_sync && flutter test test example
      description: 순수 Dart 코어와 Flutter 어댑터 테스트

    serverpod-offline-sync:analyze:
      run: cd packages/serverpod_offline_sync && dart analyze --fatal-infos && cd ../serverpod_offline_sync_client && dart analyze --fatal-infos && cd ../serverpod_offline_sync_server && dart analyze --fatal-infos && cd ../../test/offline_sync_watch_test_server && dart analyze --fatal-infos && cd ../offline_sync_watch_test_client && dart analyze --fatal-infos
      description: serverpod_offline_sync 포크와 watch fixture 분석 (각 패키지 pub get 선행)

    serverpod-offline-sync:test:
      run: cd packages/serverpod_offline_sync && dart test && cd ../serverpod_offline_sync_server && dart test --concurrency=1 && cd ../../test/offline_sync_watch_test_client && dart test
      description: 포크 엔진 단위·모듈 통합(SQLite)·Model.db.watch 테스트

    serverpod-offline-sync:generate:
      run: cd packages/serverpod_offline_sync_server && dart run serverpod_cli generate && cd ../../test/offline_sync_watch_test_server && dart run serverpod_cli generate
      description: 포크 모듈과 watch fixture 코드 재생성 (의존성의 CLI 4.1.0-beta.1 사용)

    analyze:
      run: melos exec -- dart analyze --fatal-infos
      description: 전체 패키지 정적 분석

    format:
      run: melos exec -- dart format .
      description: 전체 패키지 포맷

    test:
      run: melos exec --dir-exists=test --no-flutter -- dart test && melos exec --dir-exists=test --flutter -- flutter test
      description: 전체 패키지 테스트 (Dart 패키지는 dart test, Flutter 패키지는 flutter test)

    generate:
      run: melos exec --scope="*_server" -- serverpod generate
      description: 서버 패키지 serverpod 코드 생성 (모델/엔드포인트)
