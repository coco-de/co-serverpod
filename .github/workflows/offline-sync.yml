name: Offline sync

on:
  pull_request:
    paths:
      - packages/serverpod_offline_sync/**
      - packages/serverpod_offline_sync_client/**
      - packages/serverpod_offline_sync_server/**
      - test/offline_sync_watch_test_client/**
      - test/offline_sync_watch_test_server/**
      - analysis_options.yaml
      - .github/workflows/offline-sync.yml
  push:
    branches: [main]
    paths:
      - packages/serverpod_offline_sync/**
      - packages/serverpod_offline_sync_client/**
      - packages/serverpod_offline_sync_server/**
      - test/offline_sync_watch_test_client/**
      - test/offline_sync_watch_test_server/**
      - analysis_options.yaml
      - .github/workflows/offline-sync.yml

permissions:
  contents: read

jobs:
  serverpod-offline-sync:
    name: serverpod_offline_sync fork
    runs-on: ubuntu-latest
    # 로컬 실측: pub get·분석·테스트 합계 약 2분(SQLite 네이티브 빌드 훅 포함).
    # CI 표본이 쌓이면 실측 최대 × 2 로 재산정한다.
    timeout-minutes: 20
    steps:
      # 외부 액션은 커밋 SHA 로 고정한다(고정되지 않은 참조는 pinned-actions.yml 이 막는다).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Engine
        working-directory: packages/serverpod_offline_sync
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: Client
        working-directory: packages/serverpod_offline_sync_client
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: Server module (SQLite integration tests)
        working-directory: packages/serverpod_offline_sync_server
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test --concurrency=1
      - name: Watch fixture server (PostgreSQL integration tests)
        working-directory: test/offline_sync_watch_test_server
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed test
          dart analyze --fatal-infos
          dart test --concurrency=1
      - name: Model.db.watch tests
        working-directory: test/offline_sync_watch_test_client
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib/offline_sync_watch_test_client.dart test
          dart analyze --fatal-infos
          dart test
