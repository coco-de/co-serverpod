name: Pinned actions

# 외부 GitHub Action 참조가 전부 40자리 커밋 SHA 로 고정돼 있는지 검사한다.
# 태그(`@v4`)는 업스트림이 옮길 수 있는 참조라서, 워크플로가 돌 때마다 같은 코드를 실행하도록
# SHA 로 고정한다. 새 액션을 쓸 때는 `uses: owner/repo@<40자리 SHA> # v1.2.3` 으로 적는다.
# 줄 끝 버전 주석은 Dependabot 이 SHA 와 함께 갱신한다(.github/dependabot.yml).
#
# 검사기는 .github/scripts/check_pinned_actions.py(표준 라이브러리만 사용)이고, 같은 디렉터리의
# 단위 테스트를 먼저 돌려 검사기 자체가 조용히 고장나지 않았는지 본다.

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/scripts/check_pinned_actions.py
      - .github/scripts/test_check_pinned_actions.py
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/scripts/check_pinned_actions.py
      - .github/scripts/test_check_pinned_actions.py

permissions:
  contents: read

jobs:
  pinned-actions:
    name: 외부 액션 SHA 고정 검사
    runs-on: ubuntu-latest
    # 체크아웃과 표준 라이브러리 스크립트 한 번이라 수 초면 끝난다. 표본이 쌓이면 실측 최대 × 2 로
    # 다시 잡는다.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 검사기 단위 테스트
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: 고정되지 않은 참조 검사
        run: python3 .github/scripts/check_pinned_actions.py
